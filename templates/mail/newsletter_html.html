<body style="margin:0; padding:0; background-color:#f4f4f4;">
  <!-- Preheader / Preview-Text (in den meisten Clients ausgeblendet) -->

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f4f4;">
    <tr>
      <td align="center" style="padding:24px 12px;">

        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" align="center"><tr><td>
        <![endif]-->
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%; max-width:600px; background-color:#ffffff;">
          <tr>
            <td style="padding:24px 24px 24px 24px; font-family:Arial,Helvetica,sans-serif; font-size:15px; line-height:1.5; color:#222222;">
              {{.Content}}
            </td>
          </tr>
        </table>
